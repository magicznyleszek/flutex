<!DOCTYPE html>
<!-- No data-mantine-color-scheme here: color-scheme-boot.ts sets it from what the user
     chose last time, and a hardcoded value would flash the wrong scheme first. -->
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <!-- The manifest's single `theme_color` cannot follow a toggle, so an installed app
         would keep one status bar colour in both schemes. These two override it per system
         preference, which is as close as a declaration gets: someone who overrides the
         scheme in-app against their system setting still sees the other bar. -->
    <meta name="theme-color" content="hsl(32, 16%, 92%)" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="hsl(32, 16%, 8%)" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="./flutex-icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta
      name="description"
      content="Flutex — a recorder, tin whistle and ocarina trainer. It listens through your microphone and waits until you play the right note."
    />
    <title>Flutex — recorder, tin whistle and ocarina trainer</title>

    <!-- Deliberately not `type="module"`: a module is deferred until the document has
         parsed, and this has to run before the first paint. -->
    <script src="./color-scheme-boot.ts"></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>

</html>
